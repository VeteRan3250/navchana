<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гіперлінки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #222222;
            margin: 25px;
        }

        .page-container {
            border: 2px solid #555555;
            padding: 30px;
            max-width: 650px;
            margin: 0 auto;
            border-radius: 4px;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 25px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .page-container > h2:first-child {
            margin-top: 0;
        }

        a {
            color: #0066cc;
            text-decoration: underline;
        }

        a:visited {
            color: #551a8b;
        }

        a:hover {
            color: #ff0000;
            text-decoration: none;
        }

        a:active {
            color: #00aa00;
        }

        .nav-menu {
            margin-bottom: 20px;
        }

        .nav-menu a {
            margin: 0 4px;
        }

        .nav-menu a:first-child {
            margin-left: 0;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .footer-section {
            margin-top: 25px;
        }

        .footer-section p {
            margin: 6px 0;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="page-container">

        <h2>Навігація</h2>
        <nav class="nav-menu">
            <a href="#">Головна</a> | 
            <a href="about.html">Про нас</a> | 
            <a href="#contacts">Контакти</a>
        </nav>

        <h2>Гіперпосилання</h2>
        <div class="links-list">
            <div>
                <a href="https://www.youtube.com/?app=desktop&gl=UA&hl=uk" target="_blank">Перейти на зовнішній сайт</a>
            </div>
            <div>
                <a href="about.html">Дізнатися більше про нас</a>
            </div>
            <div>
                <a href="#contacts">Перейти до кінця сторінки</a>
            </div>
        </div>

        <section id="contacts" class="footer-section">
            <h2>Контакти</h2>
            <p>Email: <a href="ya025879@gmail.com">ya025879@gmail.com</a></p>
            <p>&copy; 2025 Ваша компанія</p>
        </section>

    </div>

</body>
</html>
