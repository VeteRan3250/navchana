<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форматування блочних та вбудованих елементів</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #ffffff;
            color: #333333;
        }

        .wrapper {
            border: 2px solid #555555;
            padding: 25px;
            max-width: 750px;
            margin: 0 auto;
            border-radius: 4px;
        }

        .block-top {
            background-color: #dedede;
            border: 1px solid #777777;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .block-top h3 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .block-top span {
            font-size: 0.85rem;
            color: #333333;
        }

        .inline-section {
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .highlight-badge {
            background-color: #ff9800;
            color: #ffffff;
            padding: 2px 6px;
            font-weight: bold;
            display: inline-block;
        }

        .link-sample {
            color: #1a73e8;
            text-decoration: underline;
        }

        .block-center {
            background-color: #d8ecf8;
            border: 2px dashed #1e88e5;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .block-center h4 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .block-center p {
            margin: 0;
            font-size: 0.9rem;
            color: #444444;
        }

        .buttons-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .tag-btn {
            background-color: #ff7043;
            color: #ffffff;
            padding: 10px 25px;
            border-radius: 4px;
            font-size: 0.85rem;
            display: inline-block;
            text-align: center;
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <div class="block-top">
            <h3>Це блочний елемент</h3>
            <span>Він займає всю ширину контейнера</span>
        </div>

        <div class="inline-section">
            <span class="highlight-badge">Це цілісний</span> текст з <a href="#" class="link-sample">посиланням</a>
        </div>

        <div class="block-center">
            <h4>Ще один блочний елемент</h4>
            <p>Цей має інший фон і границю</p>
        </div>

        <div class="buttons-row">
            <span class="tag-btn">Елемент 1</span>
            <span class="tag-btn">Елемент 2</span>
            <span class="tag-btn">Елемент 3</span>
        </div>

    </div>

</body>
</html>
